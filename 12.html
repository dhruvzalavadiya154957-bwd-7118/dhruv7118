<!DOCTYPE html>
<html>
<head>
    <title>Margin and Padding</title>

    <style>
        .box {
            background-color: purple;
            border: 3px solid black;

            
            margin: 50px;

        
            padding: 30px;
        }
    </style>
</head>

<body>

    <div class="box">
        This box demonstrates Margin and Padding.
    </div>

</body>
</html>
